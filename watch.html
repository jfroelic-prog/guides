<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Opening video…</title>
<style>
  :root{ --font:"Century Gothic",CenturyGothic,"URW Gothic","Avant Garde",Futura,"Trebuchet MS",sans-serif; }
  body{ font:16px/1.6 var(--font); color:#211d17; background:#faf7f0; margin:0;
        min-height:100vh; display:grid; place-items:center; padding:24px; }
  .box{ text-align:center; max-width:460px; }
  h1{ font-size:22px; margin:0 0 6px; }
  p{ color:#7c7466; margin:0 0 18px; }
  .spin{ width:26px; height:26px; margin:0 auto 16px; border:3px solid #e6decd;
         border-right-color:#0e6b58; border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s{ to{ transform:rotate(360deg); } }
  a.btn{ display:inline-block; margin:4px; padding:9px 16px; border:1px solid #e6decd;
         border-radius:999px; background:#fff; color:#211d17; text-decoration:none;
         font:600 14px inherit; }
  a.btn:hover{ border-color:#0e6b58; }
  .hide{ display:none; }
</style>
</head>
<body>
<div class="box">
  <div id="load">
    <div class="spin"></div>
    <h1>Opening the video…</h1>
    <p id="loadNote">One moment.</p>
  </div>
  <div id="fail" class="hide">
    <h1 id="failTitle">No video yet</h1>
    <p id="failNote">There isn’t a video for this guide.</p>
    <a class="btn" id="guideLink" href="./">📖 Open the guide</a>
    <a class="btn" href="./">⌂ All guides</a>
  </div>
</div>
<script>
/* A permanent link for a guide's video.
   Share  …/watch.html?g=<guide>.html  instead of the raw YouTube/Drive URL:
   re-upload a new version, register the new link in the admin, and this URL
   keeps working for everyone who already has it. */
(function(){
  // Set this to the same Apps Script web-app URL as index.html / admin.html.
  var COUNTER_URL = "https://script.google.com/macros/s/AKfycbzHgqaI8c8nmFz4k0knh1QnuRmoPPHdVVGnc8RbvIarQLaaGZ0m8R5C3q0tmk1lmnS9/exec";

  function guideName(){
    var q = new URLSearchParams(location.search);
    var g = (q.get("g") || q.get("guide") || "").trim().toLowerCase();
    g = g.split("/").pop().split("?")[0];
    return /^[a-z0-9._-]+\.html$/.test(g) ? g : "";
  }
  var g = guideName();
  function fail(title, note){
    document.getElementById("load").className = "hide";
    var f = document.getElementById("fail"); f.className = "";
    if (title) document.getElementById("failTitle").textContent = title;
    if (note)  document.getElementById("failNote").textContent  = note;
    if (g) document.getElementById("guideLink").href = g;
    else document.getElementById("guideLink").className = "hide";
    document.title = title || "No video";
  }
  if (!g) return fail("Nothing to open", "This link is missing the guide it belongs to.");
  if (!COUNTER_URL || COUNTER_URL.indexOf("http") !== 0)
    return fail("Not set up yet", "This site has no video directory configured.");

  var cb = "__ssWatch" + Math.floor(Math.random() * 1e9);
  var timer = setTimeout(function(){
    fail("Couldn’t reach the video list", "Try the guide itself — it has the video too.");
  }, 8000);
  window[cb] = function(d){
    clearTimeout(timer);
    var link = d && d.videos && d.videos[g];
    if (link) { location.replace(link); return; }   // replace(): Back returns where they came from
    fail("No video yet", "This guide doesn’t have a video linked to it.");
  };
  var s = document.createElement("script");
  s.src = COUNTER_URL + (COUNTER_URL.indexOf("?") < 0 ? "?" : "&") + "action=videos&callback=" + cb;
  s.onerror = function(){ clearTimeout(timer);
    fail("Couldn’t reach the video list", "Try the guide itself — it has the video too."); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
